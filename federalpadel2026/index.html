<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <!-- Se permite el desplazamiento vertical nativo en celulares -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Torneo - Lista de Partidos</title>

  <!-- SDKs de Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      background-color: #f1f2f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #2d3436;
      /* Garantiza scroll vertical fluído en celulares */
      overflow-y: auto;
    }
    .app-header {
      position: sticky;
      top: 0;
      background-color: #0984e3;
      color: white;
      padding: 14px 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .role-pill {
      background: rgba(255, 255, 255, 0.25);
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .container {
      padding: 12px;
      max-width: 500px;
      margin: 0 auto;
      padding-bottom: 40px; /* Espacio extra al final para scroll completo */
    }
    /* Tarjeta del Partido */
    .card-partido {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
      border: 1px solid #e1e8ef;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
    }
    .badge-pendiente {
      background-color: #ffeaa7;
      color: #d63031;
    }
    .badge-finalizado {
      background-color: #55efc4;
      color: #00b894;
    }
    .matchup {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 15px;
      font-weight: 600;
      padding: 4px 0;
    }
    .pareja {
      display: flex;
      align-items: center;
      gap: 6px;
      word-break: break-word;
    }
    .vs-divider {
      font-size: 10px;
      color: #b2bec3;
      font-weight: bold;
      text-transform: uppercase;
    }
    /* La fecha se ubica abajo para evitar que se corte horizontalmente */
    .info-fecha {
      font-size: 12px;
      color: #636e72;
      background-color: #f8f9fa;
      padding: 6px 10px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    .btn-accion {
      display: block;
      width: 100%;
      height: 44px;
      line-height: 44px;
      background-color: #0984e3;
      color: white;
      text-align: center;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      box-sizing: border-box;
      margin-top: 4px;
    }
    .btn-admin {
      background-color: #6c5ce7;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>Fixture Torneo</h1>
    <span id="rol-tag" class="role-pill">INVITADO</span>
  </header>

  <div class="container">
    <div id="lista-partidos">
      <p style="text-align: center; color: #636e72; margin-top: 20px;">Cargando partidos...</p>
    </div>
  </div>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "TU_API_KEY",
      authDomain: "TU_PROJECT.firebaseapp.com",
      projectId: "TU_PROJECT_ID",
      storageBucket: "TU_PROJECT.appspot.com",
      messagingSenderId: "TU_SENDER_ID",
      appId: "TU_APP_ID"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const auth = firebase.auth();

    let userRole = 'invitado';

    auth.onAuthStateChanged(async (user) => {
      const rolTag = document.getElementById('rol-tag');
      
      if (user && !user.isAnonymous) {
        try {
          const userDoc = await db.collection('usuarios').doc(user.uid).get();
          if (userDoc.exists) {
            userRole = userDoc.data().rol || 'invitado';
          }
        } catch (e) {
          console.error("Error al obtener rol:", e);
        }
      } else {
        userRole = 'invitado';
      }

      rolTag.innerText = userRole.toUpperCase();
      cargarPartidos();
    });

    function cargarPartidos() {
      const contenedor = document.getElementById('lista-partidos');

      db.collection("partidos").onSnapshot((snapshot) => {
        contenedor.innerHTML = '';

        if (snapshot.empty) {
          contenedor.innerHTML = '<p style="text-align: center; color: #636e72;">No hay partidos cargados.</p>';
          return;
        }

        snapshot.forEach((doc) => {
          const partido = doc.data();
          const pId = doc.id;
          const esAdmin = userRole === 'admin' || userRole === 'superadmin';

          const card = document.createElement('div');
          card.className = 'card-partido';
          card.innerHTML = `
            <div class="card-top">
              <span class="badge badge-${partido.estado || 'pendiente'}">${partido.estado || 'pendiente'}</span>
            </div>
            
            <div class="matchup">
              <div class="pareja">🎾 ${partido.pareja1 || 'Pareja 1'}</div>
              <div class="vs-divider">VS</div>
              <div class="pareja">🎾 ${partido.pareja2 || 'Pareja 2'}</div>
            </div>

            <div class="info-fecha">
              📅 <span>${partido.fecha ? formatearFecha(partido.fecha) : 'Fecha sin programar'}</span>
            </div>

            <a href="ver.html?id=${pId}" class="btn-accion ${esAdmin ? 'btn-admin' : ''}">
              ${esAdmin ? '✏️ Cargar / Editar Resultado' : '👁️ Ver Detalle'}
            </a>
          `;
          contenedor.appendChild(card);
        });
      });
    }

    function formatearFecha(fechaStr) {
      if (!fechaStr) return '';
      const fecha = new Date(fechaStr);
      if (isNaN(fecha)) return fechaStr;
      return fecha.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) + ' hs';
    }
  </script>

</body>
</html>
